[package]
name = "workcontext-desktop"
description = "Tauri v2 桌面入口：commands、capabilities、打包配置"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "workcontext-desktop"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
workcontext-core = { workspace = true }
workcontext-store = { workspace = true }
workcontext-app = { path = "../app" }
workcontext-infra = { path = "../infra" }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Graphics_Dwm", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]
