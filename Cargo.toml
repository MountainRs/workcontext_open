[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/store",
    "crates/infra",
    "crates/app",
    "crates/desktop",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Proprietary"

[workspace.dependencies]
workcontext-core = { path = "crates/core" }
workcontext-store = { path = "crates/store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"

# 依赖方向（详细设计 §1）：core ← store ← infra ← app ← desktop。
# core 不得依赖 tokio / rusqlite；该约束由 CI 脚本与 review 保证。

[profile.release]
lto = true
codegen-units = 1
strip = true
